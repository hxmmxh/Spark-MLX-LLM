[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-mlx-llm"
version = "0.1.2"
description = "Spark2_5 inference support for MLX LM"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "gguf>=0.17.0",
    "mlx-lm==0.31.3",
]

[project.optional-dependencies]
metal = ["spark-mlx-ext==0.2.0; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.11'"]
cuda12 = ["mlx[cuda12]>=0.32.1"]
cuda13 = ["mlx[cuda13]>=0.32.1"]

[project.scripts]
spark-mlx = "spark_mlx_llm.cli:main"

[tool.uv.sources]
spark-mlx-ext = { path = "extensions/spark-mlx-ext", editable = true }

[tool.setuptools.packages.find]
include = ["spark_mlx_llm*"]

[tool.ruff]
line-length = 88
target-version = "py310"
